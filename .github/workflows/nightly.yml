name: Nightly

# The counterpart to ci.yml. That workflow gates every push and keeps itself
# narrow on purpose: the node's and the log server's own tests, and one start.
# This one asks the two questions a gate should not be asked.
#
# The first is wider: every test of every library in this solution, at the
# gitlinks this repository pins. Each library gates its own tests in its own
# repository, but nobody there tests this combination of them - Hermod's suite
# against this Styx, Norn's against this Hermod, WWCP_Node's against this Norn,
# in one process.
#
# The second is the opposite of pinning: the submodules moved to their tips, to
# find out whether advancing the gitlinks would work before somebody advances
# them.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:43 UTC, after the libraries of this stack have run theirs - Hermod
    # and Urdr at 02:17, WWCP_Node at 02:47 - and beside NTSServerCLI's 03:23
    # and DNSServerCLI's 03:33, so that a morning is read in the order the
    # dependencies are stacked. Not on the hour, because GitHub's scheduler is
    # busiest then; and on a minute no other program of the family has taken.
    - cron: '43 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # Everything, at the pinned gitlinks. Same two legs as ci.yml - see there for
  # why it is exactly Windows and a debian:13 container, and why Node is needed
  # on both.
  # ---------------------------------------------------------------------------
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:

      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 openssl tzdata xz-utils && git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Build
        run: dotnet build LogServerCLI.slnx --configuration Release

      # The web interface's type checks and its own tests, as in ci.yml - on one
      # leg, since TypeScript does not know which platform it is on.
      - name: The web interface (type checks and its own tests)
        if: matrix.leg == 'debian-13-container'
        working-directory: libs/LogServer/LogServer/Frontend
        run: |
          npm run typecheck
          npm run typecheck:test
          npm test

      # Every test project in the solution, which is what makes this different
      # from the gate: LogServerTests and WWCP_Node_Tests plus Styx, Hermod,
      # Norn and Urdr, all against each other at the versions pinned here.
      #
      # Three categories left out, and they are somebody else's decision rather
      # than ours: Hermod marks its live DNS probes "LiveDNS", Norn marks its
      # real NTS-KE and NTP handshakes "External" and "LiveNetwork". All of them
      # query Cloudflare, Google, PTB and Netnod for real, and datacentre egress
      # on UDP/53 and UDP/123 is commonly blocked or rate-limited - so they
      # would fail here for reasons that say nothing about any of this code.
      #
      # One TRX file per test project: LogFilePrefix names each after the leg,
      # where LogFileName would give all of them the same file.
      #
      # Fatal, unlike the two steps further down: a red here is a real
      # regression in a combination this repository is responsible for.
      #
      # --blame-hang: a test that has not finished after 15 minutes is a hang;
      # its test host is dumped and stopped, and the console names the test.
      # --blame-crash: a test host that dies is dumped as it dies.
      - name: Test everything, as pinned
        timeout-minutes: 120
        run: dotnet test LogServerCLI.slnx --configuration Release --no-build --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini --filter "TestCategory!=LiveDNS&TestCategory!=External&TestCategory!=LiveNetwork" --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=${{ matrix.leg }}" --results-directory artifacts

      # The same start as in ci.yml, for the same reason and on the same leg.
      # Repeating it costs a minute and catches the kind of failure that only
      # shows up when nobody pushed: a dependency resolved at restore time that
      # moved, a container image that changed. !cancelled(), because a red
      # suite above says nothing about whether the thing still starts.
      - name: The log server starts and answers (Debian)
        if: ${{ matrix.leg == 'debian-13-container' && !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: .github/scripts/starts-and-answers.sh

      - name: The log server runs (Windows)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        run: dotnet LogServerCLI/bin/Release/net11.0/LogServerCLI.dll --help

      # The NuGet packages of the whole solution, transitives included, and the
      # npm packages of the web interface. One leg: a property of the
      # dependency graph, not of the operating system.
      #
      # Informational: an advisory published overnight is news about the world,
      # not a regression here - the same commit that was green yesterday is
      # affected today without a line having changed. That is also why it lives
      # in the night and not in the gate.
      - name: Known vulnerabilities (informational)
        if: ${{ matrix.leg == 'debian-13-container' && !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo '## Known vulnerabilities (informational)'
            echo
            echo 'Every project of the solution, transitive packages included, and'
            echo 'the packages of the web interface. Informational: an advisory'
            echo 'published overnight is news, not a regression, so this step cannot'
            echo 'turn the night red.'
            echo
            echo '```'
            dotnet list LogServerCLI.slnx package --vulnerable --include-transitive 2>&1 \
              | grep -v "has no vulnerable packages given the current sources" \
              | tail -60
            echo
            (cd libs/LogServer/LogServer/Frontend && npm audit --omit=dev 2>&1 | tail -30)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          # The blame's files sit one directory down, in a GUID-named one.
          path: |
            artifacts/*.trx
            artifacts/*/Sequence_*.xml
            artifacts/*/*_hangdump.dmp
            artifacts/*/*_crashdump.dmp


  # ---------------------------------------------------------------------------
  # The other question: what would happen if the gitlinks were advanced today?
  #
  # This repository pins, which is right for something that is deployed - but
  # it means an upstream change is invisible here until somebody advances a
  # gitlink and finds out by hand. That is exactly what this job does instead,
  # every night and without changing anything.
  #
  # Informational throughout. A red here is news about a library, not a
  # regression in this repository: the pinned combination is what CI gates.
  #
  # One leg, because "does the new Hermod still compile against this log
  # server" is not a question about the operating system.
  # ---------------------------------------------------------------------------
  submodules-at-their-tips:
    runs-on: ubuntu-latest
    container: debian:13
    steps:

      - name: Install prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata xz-utils && git config --global --add safe.directory '*'

      # Full history rather than the usual shallow one: counting how far each
      # submodule has moved needs the commits in between to exist.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # Remembered before anything moves, so that afterwards each one can be
      # asked how far it went. --remote takes the tip of each submodule's
      # remote HEAD - master for all of them - instead of the sha pinned here.
      - name: Move every submodule to its tip
        shell: bash
        run: |
          git submodule status | awk '{ print $2, $1 }' > "$RUNNER_TEMP/pinned.txt"
          git submodule update --remote
          {
            echo '## The submodules at their tips'
            echo
            echo 'What has happened upstream since the gitlinks here were last advanced.'
            echo
            echo '```'
            while read -r path sha; do
              sha="${sha#[+-]}"
              ahead="$(git -C "$path" rev-list --count "$sha"..HEAD 2>/dev/null || echo '?')"
              printf '%-26s %4s commit(s) ahead   %s\n' "$path" "$ahead" "$(git -C "$path" rev-parse HEAD)"
            done < "$RUNNER_TEMP/pinned.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build against the tips (informational)
        id: build
        continue-on-error: true
        run: dotnet build LogServerCLI.slnx --configuration Release

      - name: Test against the tips (informational)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 120
        run: dotnet test LogServerCLI.slnx --configuration Release --no-build --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini --filter "TestCategory!=LiveDNS&TestCategory!=External&TestCategory!=LiveNetwork" --logger "console;verbosity=normal"

      - name: Say how it went
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo
            echo "Build against the tips: ${{ steps.build.outcome }}"
            echo
            echo 'Informational. The gitlinks in this repository are unchanged and'
            echo 'CI gates them as they are; this only says what advancing them'
            echo 'would cost today.'
          } >> "$GITHUB_STEP_SUMMARY"
